name: Sync ALAMAT Full Mobile v4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-full-mobile-v4.yml"
      - "tools/patch_full_mobile_v4.py"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download full game from current Astra site
        run: |
          mkdir -p full-mobile-v4
          curl -L --fail --retry 3 --retry-delay 2 "https://alamat-full-mobile-beta.idrenartstrong.chatgpt.site/" -o full-mobile-v4/source.html

      - name: Apply fullscreen mobile controls patch
        run: python tools/patch_full_mobile_v4.py

      - name: Commit generated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-mobile-v4/index.html full-mobile-v4/.nojekyll
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Sync full ALAMAT mobile v4 preview"
            git push
          fi
